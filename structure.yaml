version: 1

target_data_to_send:
  # Nombre de la carpeta que contiene los YAMLs (main.yml y referencias)
  mapping: mappings-envio-mag
  
  # Tabla de control desde donde se extraen los IDs pendientes
  control_table: control_envios_boletas
  
  # Nombre de la columna en control_table que contiene los IDs únicos
  # Estos IDs deben coincidir con source_reference_field de la tabla principal
  # Ejemplo: control_envios_boletas._id (integer) == boletas.bol_id_levanta (string)
  # NOTA: Se convertirá automáticamente _id a string para la comparación
  control_table_id: _id
  
  # Clave primaria de control_table (para UPDATE/WHERE en modificaciones de estado)
  # Ejemplo: control_envios_boletas._id (PK autoincremental)
  control_table_primary_key: _id
  
  # Filtros para consultar registros pendientes en control_table
  # Se construye: WHERE {column} = {value} AND {column} = {value} ...
  control_table_filters:
    - column: 'estado_etl'
      value: 'APROBADO'
      type: 'enum'
    - column: 'envio_datos_procesados'
      value: 'PENDIENTE'
      type: 'enum'

  source_reference_file: main.yml

  source_reference_field: bol_id_levanta

  source_database_id: bol_id

