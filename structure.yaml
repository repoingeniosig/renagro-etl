version: 1

target_data_to_send:
  # Nombre de la carpeta que contiene los YAMLs (main.yml y referencias)
  mapping: mappings-envio-mag
  
  # Tabla de control desde donde se extraen los IDs pendientes
  control_table: control_envios_boletas
  
  # Nombre de la columna en control_table que contiene los IDs únicos
  # Estos IDs deben coincidir con el database_id del main.yml
  # Ejemplo: control_envios_boletas.uuid_boleta == boletas.bol_uuid
  control_table_id: uuid_boleta
  
  # Filtros para consultar registros pendientes en control_table
  # Se construye: WHERE {column} = {value} AND {column} = {value} ...
  control_table_filters:
    - column: 'estado_etl'
      value: 'PROCESADO'
      type: 'enum'
    - column: 'envio_datos_procesados'
      value: 'PENDIENTE'
      type: 'enum'
  
