    default: null

  per_primer_nombre:
    source: "capitulos_1_10_wrapper/datos_pp_group/nombre_pp_group/primer_nombre"
    type: string
    default: null

  per_razon_social:
    source: "capitulos_1_10_wrapper/datos_pp_group/nombre_pp_group/razon_social"
    type: string
    default: null

  per_segundo_apellido:
    source: "capitulos_1_10_wrapper/datos_pp_group/nombre_pp_group/segundo_apellido"
    type: string
    default: null

  per_segundo_nombre:
