# Configuración de Formularios Multi-ETL
# Define los UUIDs de formularios soportados y sus configuraciones

forms:
  # Formulario Principal - Boletas Completas
  - uuid: "aa"
    name: "boletas"
    description: "Formulario principal de boletas agropecuarias"
    control_table: "control_envios_boletas"
    mapping_dir: "boletas"
    enabled: true
    
  # Formulario de Procesos Productivos
  - uuid: "bb"
    name: "boletas-procesos"
    description: "Formulario de procesos productivos"
    control_table: "control_envios_boletas_procesos"
    mapping_dir: "boletas-procesos"
    enabled: true
    
  # Formulario Simplificado
  - uuid: "cc"
    name: "boletas_simplificadas"
    description: "Formulario simplificado de boletas"
    control_table: "control_envios_boletas_simplificadas"
    mapping_dir: "boletas-simplificadas"
    enabled: true

# Configuración global
config:
  # Directorio base donde están las carpetas de mapeos
  mappings_base_dir: "mappings"
  
  # Campo del JSON que contiene el UUID del formulario
  uuid_field: "formhub/uuid"
  
  # Comportamiento si el UUID no está registrado
  reject_unknown_forms: true
  
  # Log de formularios no reconocidos
  log_unknown_forms: true
