# Ejemplo de archivo de mapeo para la tabla personas
# Este archivo define cómo extraer y transformar datos del JSON de KoboToolbox
# para la tabla personas en la base de datos

version: 1.0
entity: personas
table: personas

fields:
  # Información básica de la persona productora
  per_identificacion:
    source: "capitulo_1.datos_productor.cedula"
    type: string
    default: null

  per_nombres:
    source: "capitulo_1.datos_productor.nombres"
    type: string
    default: null

  per_apellidos:
    source: "capitulo_1.datos_productor.apellidos"
    type: string
    default: null

  per_sexo:
    source: "capitulo_1.datos_productor.sexo"
    type: integer
    convert:
      sexo_to_int: true
    default: null

  per_fecha_nacimiento:
    source: "capitulo_1.datos_productor.fecha_nacimiento"
    type: string
    default: null

  per_edad:
    source: "capitulo_1.datos_productor.edad"
    type: integer
    default: null

  per_estado_civil:
    source: "capitulo_1.datos_productor.estado_civil"
    type: integer
    convert:
      estado_civil_to_int: true
    default: null

  per_nivel_educacion:
    source: "capitulo_1.datos_productor.nivel_educacion"
    type: integer
    convert:
      educacion_to_int: true
    default: null

  per_sabe_leer_escribir:
    source: "capitulo_1.datos_productor.sabe_leer_escribir"
    type: boolean
    convert:
      yes_no_to_bool: true
    default: false

  # Información de contacto
  per_telefono_celular:
    source: "capitulo_1.contacto.celular"
    type: string
    default: null

  per_telefono_convencional:
    source: "capitulo_1.contacto.telefono"
    type: string
    default: null

  per_email:
    source: "capitulo_1.contacto.email"
    type: string
    default: null

  # Ubicación
  per_provincia:
    source: "capitulo_1.ubicacion.provincia"
    type: string
    default: null

  per_canton:
    source: "capitulo_1.ubicacion.canton"
    type: string
    default: null

  per_parroquia:
    source: "capitulo_1.ubicacion.parroquia"
    type: string
    default: null

# Conversiones personalizadas
conversions:
  # Conversión de Si/No a booleano
  yes_no_to_bool:
    Si: true
    Sí: true
    No: false
    NO: false

  # Conversión de sexo a código numérico
  sexo_to_int:
    Hombre: 1
    Mujer: 2
    Masculino: 1
    Femenino: 2

  # Conversión de estado civil
  estado_civil_to_int:
    Soltero: 1
    Soltera: 1
    Casado: 2
    Casada: 2
    Divorciado: 3
    Divorciada: 3
    Viudo: 4
    Viuda: 4
    Union libre: 5
    Unión libre: 5

  # Conversión de nivel de educación
  educacion_to_int:
    Ninguno: 1
    Primaria: 2
    Secundaria: 3
    Bachillerato: 4
    Superior: 5
    Postgrado: 6
