version: 1.0
entity: adjuntos
table: adjuntos
pk_field: adj_id

repeat:
  source: "_attachments"

# id de boleta
parent_keys:
  - field: bol_id
    from_entity: boletas

fields:
  # ID de referencia a tabla padre (generado automáticamente)
  bol_id:
    source: ""
    type: integer
    default: null

  adj_url_descarga:
    source: "download_url"
    type: string
    apply_uppercase: false
    default: null

  adj_mimetype:
    source: "mimetype"
    type: string
    apply_uppercase: false
    default: null

  adj_nombre:
    source: "media_file_basename"
    type: string
    apply_uppercase: false
    default: null